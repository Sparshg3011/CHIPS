<style>
:root{
  color-scheme:dark;
  --desk:#0C1320; --panel:#131C2C; --panel2:#1A2438; --line:#28334B;
  --txt:#E9EDF5; --mute:#97A2B7; --vio:#A791FF; --vio-d:#7453EE;

  --ui:Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
html,body{background:var(--desk)}
body{color:var(--txt);font:16px/1.55 var(--ui);padding-inline:16px;padding-block:20px 56px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap}

.player{display:flex;flex-direction:column}
.screen{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:16px;overflow:hidden;background:#FCFBF7;
  box-shadow:0 40px 90px -30px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.07);cursor:pointer}
#stage{display:block;width:100%;height:100%}
.cta{position:absolute;left:50%;bottom:5.5%;translate:-50% 0;display:flex;align-items:center;gap:.55em;
  font:800 clamp(13px,1.7vw,21px)/1 var(--hand);color:#fff;background:#17223A;border:0;border-radius:999px;
  padding:.85em 1.45em .85em 1.2em;box-shadow:0 14px 34px -8px rgba(23,34,58,.55);cursor:pointer;animation:nudge 2.2s ease-in-out infinite}
.cta[hidden],.fsb[hidden],.snd[hidden]{display:none}
.snd{position:absolute;top:4%;right:3%;display:flex;align-items:center;gap:.5em;font:700 clamp(12px,1.6vw,16px)/1 var(--ui);
  color:#fff;background:#7453EE;border:0;border-radius:999px;padding:.75em 1.15em;cursor:pointer;box-shadow:0 10px 26px -8px rgba(46,35,102,.6)}
.snd svg{width:1.25em;height:1.25em;fill:currentColor}
.cta svg{width:1.1em;height:1.1em;fill:currentColor}

.bar{display:flex;gap:4px;margin-top:16px}

.keys{margin:0;color:var(--mute);font-size:14px}

.sc{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s}
.sc.on{opacity:1;visibility:visible;transition:opacity .45s ease}
.sc.out{opacity:0;visibility:visible;transition:opacity .45s ease}

.sc g[class],.sc rect[class]{transform-box:fill-box;transform-origin:50% 50%}
.sc .grow{transform-origin:50% 100%}
.sc .growX,.sc .drain{transform-origin:0% 50%}
.sc .spin,.sc .spinS{transform-box:view-box;transform-origin:0 0}
.draw .rs{stroke-dasharray:100 100}

.sc:is(.on,.out) .fade{animation:fade .7s var(--d,0s) ease-out both}
.sc:is(.on,.out) .lift{animation:lift 1s var(--d,0s) cubic-bezier(.2,.8,.2,1) both}
.sc:is(.on,.out) .rise{animation:rise .8s var(--d,0s) cubic-bezier(.2,.8,.2,1) both}
.sc:is(.on,.out) .drop{animation:drop .9s var(--d,0s) ease-out both}
.sc:is(.on,.out) .drop2{animation:drop2 .75s var(--d,0s) ease-out both}
.sc:is(.on,.out) .pop{animation:pop .7s var(--d,0s) ease-out both}
.sc:is(.on,.out) .inL{animation:inL .75s var(--d,0s) cubic-bezier(.2,.8,.2,1) both}
.sc:is(.on,.out) .inR{animation:inR .75s var(--d,0s) cubic-bezier(.2,.8,.2,1) both}
.sc:is(.on,.out) .grow{animation:grow .8s var(--d,0s) cubic-bezier(.2,.8,.2,1) both}
.sc:is(.on,.out) .growX{animation:growX .9s var(--d,0s) cubic-bezier(.2,.8,.2,1) both}
.sc:is(.on,.out) .dim{animation:dim .8s var(--d,0s) ease both}
.sc:is(.on,.out) .hl{animation:hl .6s var(--d,0s) ease-out both}
.sc:is(.on,.out) .stamp{animation:stamp .5s var(--d,0s) ease-out both}
.sc:is(.on,.out) .spinIn{animation:spinIn .9s var(--d,0s) cubic-bezier(.2,.8,.2,1) both}
.sc:is(.on,.out) .draw .rs{animation:draw 1.2s var(--d,0s) ease-out both}
.sc:is(.on,.out) .draw .rf{animation:fade .6s calc(var(--d,0s) + .45s) ease-out both}
.sc:is(.on,.out) .draw .ah{animation:draw .35s calc(var(--d,0s) + .8s) ease-out both}
.sc:is(.on,.out) .wig{animation:wig 1.3s var(--d,0s) ease-in-out infinite}
.sc:is(.on,.out) .wig2{animation:wig2 2.6s var(--d,0s) ease-in-out infinite}
.sc:is(.on,.out) .bob{animation:bob 2.6s var(--d,0s) ease-in-out infinite}
.sc:is(.on,.out) .twinkle{animation:twinkle 1.8s var(--d,0s) ease-in-out infinite}
.sc:is(.on,.out) .pulse{animation:pulse 2.4s var(--d,0s) ease-in-out infinite}
.sc:is(.on,.out) .ring{animation:ring 1.6s var(--d,0s) ease-in-out infinite}
.sc:is(.on,.out) .hop{animation:hop 1.3s var(--d,0s) ease-in-out infinite}
.sc:is(.on,.out) .shake{animation:shake .7s var(--d,0s) linear infinite}
.sc:is(.on,.out) .blink{animation:blink 1s var(--d,0s) steps(2,jump-none) infinite}
.sc:is(.on,.out) .blink2{animation:blink2 3.2s var(--d,0s) ease-in-out infinite}
.sc:is(.on,.out) .spin{animation:spin 2.2s var(--d,0s) linear infinite}
.sc:is(.on,.out) .spinS{animation:spin 14s var(--d,0s) linear infinite}
.sc:is(.on,.out) .scan{animation:scan 3.4s var(--d,0s) linear both}
.sc:is(.on,.out) .drain{animation:drain 8s var(--d,0s) linear both}
.sc:is(.on,.out) .drain .rf{animation:drainc 8s var(--d,0s) linear both}
.sc:is(.on,.out) .fly{animation:fly .95s var(--d,0s) cubic-bezier(.45,0,.75,1) both}
.sc:is(.on,.out) .feed{animation:feed 1.4s var(--d,0s) ease-in 3 both}
.sc:is(.on,.out) .cursor{animation:cursor 2.4s var(--d,0s) ease-in-out both}
.sc:is(.on,.out) .travel{animation:travel 2.9s var(--d,0s) linear both}
.sc:is(.on,.out) .conf{animation:conf var(--du,4s) var(--d,0s) linear infinite both}

<script>
(() => {
const $ = s => document.querySelector(s);
const C = {ink:'#17223A',paper:'#FCFBF7',cocoa:'#6E4126',caramel:'#C58A55',cream:'#F6E7D6',hair:'#3B2416',
  blue:'#2F6FE4',blueL:'#DCE8FF',violet:'#7453EE',violetL:'#ECE6FF',violetD:'#2E2366',teal:'#0F9E8C',tealL:'#D5F3EE',
  green:'#2FA35C',greenL:'#D9F1E1',red:'#E0524B',redL:'#F7D3D0',amber:'#F1B43C',muted:'#66728A',slate:'#E4E9F2',w:'#FFFFFF'};

/* ---------- scene list ---------- */
const SCN = [
 {title:'CHIPS', dur:12, narr:'CHIPS, the Cloud and Hardware Integration Platform for Small Software. It’s an agentic forward deployed engineer: a layer between software vendors and their customers that handles discovery, customization, deployment, integration and support.'},
 {title:'The customer need', dur:13, narr:'Meet Cocoa&Co., a growing bakery that built a website and immediately got flooded with orders. They desperately need data tools to track profit, margins, and bestsellers, but don’t know where to turn.'},
 {title:'The seller bottleneck', dur:14, narr:'On the other side, we have DataVis, a 2-person analytics startup with world-class visualization tools. They have great tech, but zero bandwidth to negotiate, scope custom integrations, or tailor products for non-technical buyers.'},
 {title:'Who we serve & the evidence', dur:20, narr:'We serve two customers: small businesses whose workflow doesn’t fit off-the-shelf software, and small software teams with no services team. In Capterra’s October 2025 survey of 3,385 buyers, 66% hit regret or disruption, mostly during implementation. Big companies fix this with forward deployed engineers, a role whose postings grew 800% in 2025. Small vendors can’t.'},
 {title:'A fourth option', dur:13, narr:'Today a team like Cocoa&Co. gets three options: adapt to generic SaaS, pay for custom engineering, or build and maintain internal tools. CHIPS adds a fourth: a reusable product, adapted to each customer’s actual workflow.'},
 {title:'Discovery & matchmaking', dur:14, narr:'That’s where CHIPS comes in. Cocoa&Co. submits their query, our system reasons over their exact operational needs, and automatically matches them with DataVis.'},
 {title:'Agent deployment & sandbox', dur:15, narr:'We deploy an AI agent into DataVis’s codebase. It learns the tools and spins up a dedicated playground where Cocoa&Co. can chat, test interactive software mocks, and select only the 3 specific services they need.'},
 {title:'Scoping & handshake', dur:14, narr:'The agent handles technical negotiations and outputs a complete CSRS specification for quick human verification and pricing. The deal is closed seamlessly without consuming engineering hours.'},
 {title:'Integration & fulfillment', dur:15, narr:'Finally, post-deal fulfillment is automated. Whether modifying the seller’s dashboard view or directly embedding MCP or API integrations into the buyer’s codebase, our agent handles the setup end to end.'},
 {title:'After go-live', dur:15, narr:'After launch, the agent stays on both sides. It turns Cocoa&Co.’s change requests into tested configuration, checks every customization against new DataVis releases, and flags repeated requests that should become core features.'},
 {title:'The stack', dur:15, narr:'The small-software cloud makes customization technically safe. The agent makes it operationally accessible. The unit of work becomes a workflow for one customer, built on the seller’s product and kept compatible through every upgrade.'},
 {title:'Why we win', dur:15, narr:'Every alternative solves only part of this. Marketplaces stop at the sale. Agencies write custom code that forks. AI app builders start from scratch, and you maintain it. Human forward deployed engineers work, but only for six-figure contracts. We customize the vendor’s own product, test every change, and carry it through upgrades, on a bakery’s budget.'},
 {title:'Business model', dur:16, narr:'Who pays? Sellers pay a 15% success fee on a deal’s first year, only when it closes. Each live customization adds a $49 monthly care fee to the buyer’s price. On a $300-a-month plan, Cocoa&Co. pays $4,188 in year one, DataVis keeps $3,060 it would have turned away, and we earn $1,128, with zero engineering hours spent.'},
 {title:'The opportunity', dur:14, narr:'That makes small deals economical on both sides, and opens a long tail of specialized software businesses too small to run their own sales engineering, professional services and customer success teams.'},

      if (dash) el.setAttribute('stroke-dasharray', dash);
      const ah = arrowHead();
      if (ah) { const p = document.createElementNS(NS, 'polyline'); p.setAttribute('points', ah.map(q => q.join(',')).join(' ')); p.setAttribute('fill', 'none'); p.setAttribute('stroke', stroke); p.setAttribute('stroke-width', sw); p.setAttribute('pathLength', '100'); p.setAttribute('class', 'rs ah'); el.after(p); }
      continue;
    }
    const o = {stroke, strokeWidth:sw, roughness: el.hasAttribute('data-r') ? +el.getAttribute('data-r') : (size < 44 ? .45 : size < 140 ? .85 : 1.1),
      bowing: size < 44 ? .4 : .8, seed: seed++, preserveVertices:true, disableMultiStroke: size < 30, fillStyle: el.getAttribute('data-fs') || 'solid',
      fillWeight: sw * .5, hachureGap: +(el.getAttribute('data-gap') || 7), hachureAngle: -41};
    if (fill && fill !== 'none') o.fill = fill;
    if (dash) o.strokeLineDash = dash.split(/[ ,]+/).map(Number);
    let n;
    try {
      if (tag === 'rect') { const rx = g('rx'); n = rx ? R.path(rrp(g('x'), g('y'), w, hh, rx), o) : R.rectangle(g('x'), g('y'), w, hh, o); }
      else if (tag === 'circle') n = R.circle(g('cx'), g('cy'), w, o);
      else if (tag === 'ellipse') n = R.ellipse(g('cx'), g('cy'), w, hh, o);
      else if (tag === 'line') n = R.line(pts[0][0], pts[0][1], pts[1][0], pts[1][1], o);
      else if (tag === 'polygon') n = R.polygon(pts, o);
      else if (tag === 'polyline') n = R.linearPath(pts, o);
      else n = R.path(el.getAttribute('d'), o);
    } catch (e) { el.classList.add('rs'); continue; }
    for (const p of [...n.children]) {
      const isStroke = p.getAttribute('fill') === 'none' && p.getAttribute('stroke') === stroke && +p.getAttribute('stroke-width') === sw;
      p.classList.add(isStroke ? 'rs' : 'rf');
      if (isStroke && !dash) p.setAttribute('pathLength', '100');
    }
    const ah = arrowHead();
    if (ah) { const hn = R.linearPath(ah, {stroke, strokeWidth:sw, roughness:.4, bowing:.3, seed: seed++}); for (const p of [...hn.children]) { p.classList.add('rs', 'ah'); p.setAttribute('pathLength', '100'); n.appendChild(p); } }
    const cls = (el.getAttribute('class') || '').split(/\s+/).filter(c => c && c !== 'r');
    if (cls.length) n.setAttribute('class', cls.join(' '));
    for (const a of ['opacity', 'transform', 'id']) if (el.hasAttribute(a)) n.setAttribute(a, el.getAttribute(a));

}

/* ---------- player engine ---------- */
const stage = $('#stage'), screen = $('#screen'), cta = $('#cta'), ctaT = $('#ctaT'), narr = $('#narr');
const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const total = () => SCN.reduce((a, s, i) => a + dur(i), 0);
const fmt = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const setMeta = () => { $('#meta').textContent = `An animated pitch · ${SCN.length} scenes · ${fmt(total())}${HAS_VO ? ' · narrated' : ''}`; };
setMeta();
let scenes = [], segs = [], chaps = [];
let cur = -1, playing = true, started = false, ended = false, clock = 0, lastTs = null, jobs = [], autoPaused = false;
const outT = new Map();

/* voice: ONE audio element, unlocked by the viewer's first tap and reused for every scene, so later clips
   may start on their own (and iPhones play it even with the ringer switch on silent). The scene waits
   for its line to finish. If a clip can't load, the browser's own voice reads the caption. */
const VO_SRC = i => `vo/s${String(i).padStart(2, '0')}.mp3`;
const voEl = HAS_VO ? new Audio() : null;
if (voEl) { voEl.preload = 'auto'; }
if (HAS_VO) SCN.forEach((_, i) => { fetch(VO_SRC(i)).catch(() => {}); }); // warm the cache
try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
let voDone = true, voIdx = -1, voTok = 0;
function sndPrompt(show) { const b = $('#snd'); if (b) b.hidden = !show; }
function voStop() {
  voTok++;
  if (voEl) { try { voEl.pause(); } catch (e) {} }
  try { window.speechSynthesis && speechSynthesis.cancel(); } catch (e) {}
}
function speak(i) {
  try {
    if (!('speechSynthesis' in window)) { voDone = true; return; }
    const u = new SpeechSynthesisUtterance(SCN[i].narr);
    u.onend = u.onerror = () => { if (voIdx === i) voDone = true; };
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) { voDone = true; }
}
function voPlayNow(i, tok) {
  const p = voEl.play();
  if (p && p.catch) p.catch(err => {
    if (tok !== voTok) return;
    if (err && err.name === 'NotAllowedError') { voDone = true; sndPrompt(true); }   // blocked: keep the film moving, offer a tap
    else if (err && err.name !== 'AbortError') speak(i);
  });
}
function voStart(i) {
  voStop(); voIdx = i; voDone = true;
  if (!narrOn || !started || !HAS_VO) return;
  voDone = false;
  const tok = voTok;
  voEl.onended = () => { if (tok === voTok) voDone = true; };
  voEl.onerror = () => { if (tok === voTok && !voDone) speak(i); };
  voEl.src = VO_SRC(i);
  voPlayNow(i, tok);
}
function unlockSound() {            // called from the "Tap for sound" button
  sndPrompt(false);
  if (!HAS_VO) return;
  if (!narrOn) { narrOn = true; updateVoBtn(); }
  voStart(cur);
}
function voPause() { if (voEl && !voEl.paused) voEl.pause(); try { window.speechSynthesis && speechSynthesis.pause(); } catch (e) {} }
function voResume() {
  if (!narrOn || voDone || !voEl) return;
  if (voEl.paused && !voEl.ended) voPlayNow(voIdx, voTok);
  try { window.speechSynthesis && speechSynthesis.resume(); } catch (e) {}
}
function updateVoBtn() {
  const b = $('#vo'); if (!b) return;
  b.hidden = !HAS_VO;
  b.setAttribute('aria-pressed', String(narrOn));
  b.setAttribute('aria-label', narrOn ? 'Turn narration off' : 'Turn narration on');
  $('#voIcon').setAttribute('d', narrOn ? 'M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z'
    : 'M4 9v6h4l5 4V5L8 9H4zm12.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z');
}
function toggleVo() {
  if (!HAS_VO) return;
  sndPrompt(false);
  narrOn = !narrOn;
  if (!narrOn) { voStop(); voDone = true; } else if (started && playing) voStart(cur);
  updateVoBtn(); setMeta();
  segs.forEach((f, i) => f.parentNode.style.setProperty('--w', dur(i)));
  chaps.forEach((c, i) => { c.querySelector('.ch-d').textContent = Math.round(dur(i)) + 's'; });
}

function build() {
  let html = `<defs>${DEFS()}</defs><rect width="1600" height="900" fill="${C.paper}"/><rect width="1600" height="900" fill="url(#grid)"/><rect width="1600" height="900" fill="url(#grid5)"/>`;
  BUILD.forEach((b, i) => { html += `<g class="sc" id="sc${i}">${i > 0 && i < SCN.length - 1 ? actLabel(i) : ''}${b()}</g>`; });
  stage.innerHTML = html;
  roughify(stage);
  scenes = [...stage.querySelectorAll('.sc')];
}

function prep(sc) {
  jobs = [];
  sc.querySelectorAll('.type').forEach(el => {
    if (el.dataset.full == null) el.dataset.full = el.textContent;
    const full = el.dataset.full;
    if (RM) { el.textContent = full; return; }
    el.textContent = '';
    const cps = +(el.dataset.cps || 30);
    jobs.push({t0: +el.dataset.t * 1000, d: full.length / cps * 1000, fn: p => { el.textContent = full.slice(0, Math.round(full.length * p)); }});
  });
  sc.querySelectorAll('.count').forEach(el => {
    const a = +el.dataset.from, b = +el.dataset.to, suf = el.dataset.suf || '', f = v => Math.round(v).toLocaleString('en-US') + suf;
    if (RM) { el.textContent = f(b); return; }
    el.textContent = f(a);
    jobs.push({t0: +el.dataset.t * 1000, d: (+el.dataset.dur || 1) * 1000, fn: p => { el.textContent = f(a + (b - a) * (1 - Math.pow(1 - p, 3))); }});
  });
}
function runJobs() {
  for (const j of jobs) { if (j.done || clock < j.t0) continue; const p = Math.min(1, (clock - j.t0) / Math.max(1, j.d)); j.fn(p); if (p >= 1) j.done = true; }
}

function go(i) {
  i = Math.max(0, Math.min(scenes.length - 1, i));
  const prev = scenes[cur], next = scenes[i];
  if (prev && prev !== next) {
    prev.classList.remove('on'); prev.classList.add('out');
    clearTimeout(outT.get(prev)); outT.set(prev, setTimeout(() => prev.classList.remove('out'), 600));
  }
  clearTimeout(outT.get(next));
  next.classList.remove('on', 'out');
  void document.body.offsetHeight;
  next.classList.add('on');
  cur = i; clock = 0; ended = false;
  prep(next); runJobs();
  voStart(i);
  $('#nowN').textContent = i === 0 ? 'Title' : i === SCN.length - 1 ? 'Close' : `Act ${i} of ${SCN.length - 2}`;
  $('#nowT').textContent = SCN[i].title;
  narr.classList.remove('show'); void narr.offsetWidth; narr.textContent = SCN[i].narr; narr.classList.add('show');
  chaps.forEach((c, k) => { if (k === i) c.setAttribute('aria-current', 'step'); else c.removeAttribute('aria-current'); });
  $('#demo').hidden = i !== DEMO_SCENE;
  updateCta(); updatePlay();
}
function setPlaying(p) {
  playing = p;
  stage.classList.toggle('paused', !p);
  try { if (p && !RM) stage.unpauseAnimations(); else stage.pauseAnimations(); } catch (e) {}
  if (p) voResume(); else voPause();
  updatePlay();
}
function updatePlay() {
  const icon = $('#playIcon'), btn = $('#play');
  if (ended) { icon.setAttribute('d', 'M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z'); btn.setAttribute('aria-label', 'Watch again'); }
  else if (playing && !(cur === 0 && !started)) { icon.setAttribute('d', 'M7 5h4v14H7zM13 5h4v14h-4z'); btn.setAttribute('aria-label', 'Pause'); }
  else { icon.setAttribute('d', 'M8 5v14l11-7z'); btn.setAttribute('aria-label', 'Play'); }
}
function updateCta() {
  const show = (cur === 0 && !started) || ended;
  cta.hidden = !show;
  ctaT.textContent = ended ? 'Watch again' : 'Play the story';
}
function jump(i) { started = true; setPlaying(true); go(i); }
function toggle() {
  if (ended) { jump(0); return; }
  if (cur === 0 && !started) { jump(HAS_VO ? 0 : 1); return; }
  setPlaying(!playing);
}

function progress() {
  const d = dur(cur) * 1000, f = Math.min(1, clock / d);
  segs.forEach((s, j) => { s.style.transform = `scaleX(${j < cur ? 1 : j > cur ? 0 : f})`; });
  let before = 0; for (let j = 0; j < cur; j++) before += dur(j);
  $('#time').textContent = `${fmt(before + Math.min(clock, d) / 1000)} / ${fmt(total())}`;
}
function frame(ts) {
  const dt = lastTs == null ? 0 : Math.min(80, ts - lastTs); lastTs = ts;
  if (playing && cur >= 0 && !ended) {
    const d = dur(cur) * 1000;
    clock += dt; runJobs();
    if (clock > d + 9000) voDone = true; // never wait forever on a stalled clip
    if (clock >= d && (voDone || !narrOn)) {
      if (cur === 0 && !started) { /* hold on the title until the viewer starts */ }
      else if (cur < scenes.length - 1) go(cur + 1);
      else { ended = true; updateCta(); updatePlay(); }
    }
  }
  if (cur >= 0) progress();
  requestAnimationFrame(frame);
}

function ui() {
  const bar = $('#bar'), list = $('#chapters');
  SCN.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'seg'; b.type = 'button'; b.style.setProperty('--w', dur(i)); b.title = s.title;
    b.setAttribute('aria-label', `Go to scene ${i + 1}: ${s.title}`);
    const f = document.createElement('i'); b.appendChild(f); segs.push(f);
    b.addEventListener('click', () => jump(i));
    bar.appendChild(b);
    const li = document.createElement('li');
    const c = document.createElement('button');
    c.type = 'button'; c.className = 'ch';
    c.innerHTML = `<span class="ch-n">${i === 0 ? 'Title' : i === SCN.length - 1 ? 'Close' : 'Act ' + i}</span><span class="ch-d">${Math.round(dur(i))}s</span><span class="ch-t">${esc(s.title)}</span>`;
    c.addEventListener('click', () => { jump(i); $('#player').scrollIntoView({behavior: RM ? 'auto' : 'smooth', block:'start'}); });
    li.appendChild(c); list.appendChild(li); chaps.push(c);
  });
  $('#play').addEventListener('click', toggle);
  $('#next').addEventListener('click', () => { if (cur < scenes.length - 1) jump(cur + 1); });
  $('#prev').addEventListener('click', () => jump(cur - 1));
  $('#vo').addEventListener('click', toggleVo);
  updateVoBtn();
  cta.addEventListener('click', e => { e.stopPropagation(); toggle(); });
  $('#demo').addEventListener('click', e => { e.stopPropagation(); if (playing) setPlaying(false); });
  $('#snd').addEventListener('click', e => { e.stopPropagation(); unlockSound(); });
  screen.addEventListener('click', toggle);
  const fsBtn = $('#fs');
  if (!document.fullscreenEnabled) fsBtn.hidden = true;
  const fs = () => { try { if (document.fullscreenElement) document.exitFullscreen(); else $('#player').requestFullscreen().catch(() => {}); } catch (e) {} };
  fsBtn.addEventListener('click', fs);
  document.addEventListener('keydown', e => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    if (e.key === ' ' || e.key === 'k') { if (tag === 'button') return; e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); if (cur < scenes.length - 1) jump(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); jump(cur - 1); }
    else if (e.key === 'f' || e.key === 'F') fs();
    else if (e.key === 'm' || e.key === 'M') toggleVo();
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && playing) { autoPaused = true; setPlaying(false); }
    else if (!document.hidden && autoPaused) { autoPaused = false; setPlaying(true); }
  });
}

function start() {
  build(); ui();
  if (RM) { try { stage.pauseAnimations(); } catch (e) {} }
  go(0);
  requestAnimationFrame(frame);
}
const fontsReady = document.fonts ? Promise.all([
  document.fonts.load('800 40px "Shantell Sans"'), document.fonts.load('700 40px "Shantell Sans"'),
  document.fonts.load('600 20px Figtree'), document.fonts.load('600 15px "JetBrains Mono"')]).catch(() => {}) : Promise.resolve();
Promise.race([fontsReady, new Promise(r => setTimeout(r, 1800))]).then(start);
})();
</script>
